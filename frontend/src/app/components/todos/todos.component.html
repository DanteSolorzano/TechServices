<div class="todos-container">
  @if (loading()) {
    <div class="loading-container">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  } @else if (error()) {
    <mat-card class="error-card">
      <mat-card-content>
        <p class="error-text">Error: {{ error() }}</p>
      </mat-card-content>
    </mat-card>
  } @else if (menuItems().length > 0) {
    <div class="menu-grid">
      @for (item of menuItems(); track item.id) {
        <mat-card class="menu-card" (click)="openProductDetail(item)">
          <div class="image-container">
            @if (item.imagenUrl) {
              <img [src]="item.imagenUrl" [alt]="item.nombre" class="product-image" />
            } @else {
              <div class="placeholder-image"></div>
            }
          </div>
          <mat-card-content class="card-content">
            <div>
              <mat-card-title class="card-title">{{ item.nombre }}</mat-card-title>
              <mat-card-subtitle class="card-subtitle">{{ item.categoria }}</mat-card-subtitle>
            </div>
            <div class="price-container">
              <span class="price-text">${{ item.precio }}</span>
            </div>
          </mat-card-content>
        </mat-card>
      }
    </div>
  }
</div>
