<nav class="global-navbar">
  <div class="nav-logo" routerLink="/">
    <span style="font-size: 24px;"></span>
    <h2>TechServices<span style="color:#667eea">.</span></h2>
  </div>

  <div class="nav-links">
    <a routerLink="/tracking" routerLinkActive="active-link">Rastreo</a>
    
    @if (!authService.currentUser()) {
      <a routerLink="/auth" class="btn-login">Iniciar Sesión</a>
    } @else {
      
      <!-- Si es Admin -->
      @if (authService.currentUser()?.esAdmin) {
        <a routerLink="/admin" routerLinkActive="active-link">Panel Admin</a>
      } 
      <!-- Si es Técnico -->
      @else if (esTecnico(authService.currentUser())) {
        <a routerLink="/tecnico" routerLinkActive="active-link">Panel Técnico</a>
      } 
      <!-- Si es Cliente -->
      @else {
        <a routerLink="/solicitud" routerLinkActive="active-link">Mis Solicitudes</a>
      }
      
      <button (click)="logout()" class="btn-logout">Cerrar Sesión</button>
    }
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
